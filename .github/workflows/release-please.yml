name: Release Please

# Automated versioning + changelog + release, driven by Conventional Commits.
#
# On every push to main, release-please maintains a "release PR" that bumps the
# version (pyproject.toml, src/pure_mpg_mcp/__init__.py, server.json) and updates
# CHANGELOG.md. Merging that PR creates the git tag and GitHub Release.
# PyPI publishing is handled by publish.yml, which is the workflow configured as
# the PyPI Trusted Publisher.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
