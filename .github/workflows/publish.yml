name: Publish

# Builds the package and publishes it to PyPI when a GitHub Release is created.
# Uses PyPI Trusted Publishing (OIDC) — no API token needs to be stored.
# Configure the trusted publisher once at:
#   https://pypi.org/manage/account/publishing/
#   (project: pure-mpg-mcp, workflow: publish.yml, environment: pypi)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish, e.g. pure-mpg-mcp-v0.1.1"
        required: true
        default: "main"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: astral-sh/setup-uv@v8.3.1
      - name: Build sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
